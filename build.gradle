plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { maven { name = 'Fuzs Mod Resources'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
            filter { includeGroup 'fuzs.forgeconfigapiport' }
        }
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
            filter { includeGroup 'net.fabricmc' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xmaxerrs' << '100000'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
